# The backend check: it runs on every pull request, whoever or whatever wrote the code.
# Agent hooks can be skipped; this cannot, once it is a required status check.
name: Logging policy
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test guard/check.test.mjs
      - run: node guard/check.mjs fixture/src
